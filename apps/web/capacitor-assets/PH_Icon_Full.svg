      <stop offset=".7" stop-color="#b41f24"/>
      <stop offset=".9" stop-color="#a51d21"/>
      <stop offset="1" stop-color="#9c1d20"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
