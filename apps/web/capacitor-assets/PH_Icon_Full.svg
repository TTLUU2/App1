<!-- Full-bleed red icon. Same paper-plane as PH_Profile Logo.svg but
     without the circular clipPath — the red rect fills the entire
     512×512 viewBox so iOS's rounded-corner mask trims red from red
     (no white halo). Used for the iOS icon, the iOS splash, and the
     web favicon so all three read as one system. Gradient values
     preserved verbatim from the designer source. -->
