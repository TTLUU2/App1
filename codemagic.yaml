# Codemagic build pipeline for the Capacitor iOS wrapper.
#
# We don't have a Mac, so all Xcode work happens in Codemagic's macOS
# build VMs. Each build:
#   1. Pulls fresh Node 22 + pnpm via corepack
#   2. Installs the monorepo with frozen lockfile
#   3. Runs `cap add ios` in apps/web to generate the Xcode project
#      from scratch (we don't commit ios/, since regenerating is fast
#      and avoids merge headaches)
#   4. Sets bundle version + build number
#   5. Archives + exports a signed .ipa via xcodebuild
#   6. Uploads to TestFlight via the App Store Connect API
#
# NB: Capacitor 8 uses Swift Package Manager — no CocoaPods, no
# Podfile, no .xcworkspace. xcodebuild resolves SPM dependencies
# automatically during archive.
#
# Free tier: 500 build minutes/month. A typical iOS build runs 8–12
# minutes so that's ~40 builds/month, plenty for early TestFlight.

workflows:
  ios-testflight:
    name: iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        # Encrypted in Codemagic UI. Need to be populated BEFORE first
        # build (see CAPACITOR_TESTFLIGHT.md for setup steps).
        - app_store_credentials
      vars:
        # Capacitor 8 uses Swift Package Manager — no .xcworkspace gets
        # generated (no Pods → no workspace). Build directly against the
        # .xcodeproj instead.
        XCODE_PROJECT: 'App.xcodeproj'
        XCODE_SCHEME: 'App'
        BUNDLE_ID: 'com.pointhacks.copilot'
      # Capacitor 8 CLI requires Node >= 22. Use current LTS.
      node: 22.11.0
      xcode: latest
      cocoapods: default

    integrations:
      # Configured in Codemagic UI: Settings → Integrations → App Store
      # Connect. Pulls Issuer ID, Key ID, and the .p8 private key.
      app_store_connect: pointhacks_appstore

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'mobile/*'
          include: true
          source: true
        - pattern: 'main'
          include: false

    scripts:
      - name: Install pnpm
        script: |
          # Update corepack itself FIRST. Node 20.18.0 ships with an older
          # corepack (~v0.29) that has stale npm-registry signing keys
          # hardcoded. npm has since rotated its keys, which breaks the
          # signature check when corepack downloads pnpm with the error:
          #   "Internal Error: Cannot find matching keyid"
          # The newer corepack ships with the rotated keys. See
          # https://github.com/nodejs/corepack/issues/612
          npm install -g corepack@latest
          corepack enable
          corepack prepare pnpm@10.33.1 --activate
          pnpm --version

      - name: Install workspace dependencies
        script: |
          pnpm install --frozen-lockfile

      - name: Generate iOS project via Capacitor
        script: |
          set -e
          cd apps/web
          # Clean any cached state from a previous build (Codemagic VMs
          # are fresh, but defensive — cap add refuses to overwrite an
          # existing ios/).
          rm -rf ios
          # Use `pnpm exec` not `npx` — in a pnpm workspace, npx can
          # resolve differently depending on hoisting and miss the
          # workspace-local @capacitor/cli. pnpm exec always uses the
          # workspace-resolved binary.
          pnpm exec cap add ios
          pnpm exec cap sync ios
          # Sanity check — Capacitor 8 uses Swift Package Manager, so we
          # expect App.xcodeproj + CapApp-SPM (NOT a Podfile — that's
          # Capacitor 6 and earlier).
          if [ ! -d ios/App/App.xcodeproj ]; then
            echo "ERROR: ios/App/App.xcodeproj missing after cap add ios"
            echo "--- ios/ ---"
            ls -la ios/ 2>&1 || echo "(ios/ does not exist)"
            echo "--- ios/App/ ---"
            ls -la ios/App/ 2>&1 || echo "(ios/App/ does not exist)"
            exit 1
          fi
          # Generate iOS icon + splash sets from capacitor-assets/ if
          # source files are present. Skipped silently when missing so
          # the build still succeeds on fresh repos without artwork.
          if [ -f capacitor-assets/icon.png ] && [ -f capacitor-assets/splash.png ]; then
            echo "Found capacitor-assets/{icon,splash}.png — generating iOS variants"
            pnpm cap:assets
          else
            echo "capacitor-assets/{icon,splash}.png not found — skipping cap:assets (using Capacitor defaults)"
          fi
          # Inject iOS permission usage descriptions into Info.plist.
          # Capacitor regenerates Info.plist on every cap add ios run, so
          # these must be re-injected on every build. Without them, iOS
          # silently denies the WKWebView's mic + speech-recognition
          # requests and the user sees "permission denied" with no prompt
          # ever shown. PlistBuddy ships with macOS.
          INFO_PLIST="ios/App/App/Info.plist"
          MIC_DESC="PH Copilot uses your microphone for hands-free spend logging, card updates, and Copilot questions."
          SR_DESC="PH Copilot uses speech recognition to convert what you say into card updates and Copilot questions."
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string $MIC_DESC" "$INFO_PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription $MIC_DESC" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string $SR_DESC" "$INFO_PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :NSSpeechRecognitionUsageDescription $SR_DESC" "$INFO_PLIST"
          echo "Injected iOS permission usage descriptions:"
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSSpeechRecognitionUsageDescription" "$INFO_PLIST"

      - name: Set bundle version + build number from Codemagic counter
        script: |
          cd apps/web/ios/App
          # Build number = Codemagic's auto-incrementing counter, so
          # TestFlight always accepts the upload as "newer".
          agvtool new-version -all $BUILD_NUMBER
          # Bundle version (CFBundleShortVersionString) stays semver —
          # bumped by hand in the Info.plist when shipping milestones.

      # NOTE: No CocoaPods step. Capacitor 8 manages iOS plugins via
      # Swift Package Manager (Package.swift + CapApp-SPM/). xcodebuild
      # resolves SPM dependencies automatically during archive — no
      # `pod install` needed. CocoaPods was required for Capacitor 6
      # and earlier only.

      - name: Set up code signing
        script: |
          # On a fresh Codemagic VM the keychain is empty and no certs
          # or profiles exist locally. Build them from scratch via the
          # App Store Connect API integration.
          #
          # The canonical 4-step sequence per codemagic-cli-tools docs:
          # https://github.com/codemagic-ci-cd/cli-tools/blob/master/docs/app-store-connect/fetch-signing-files.md
          #
          # 1. Init a fresh build-only keychain
          keychain initialize
          # 2. Generate a fresh RSA private key. This is the key Apple
          #    will bind the cert to — must exist BEFORE asking Apple to
          #    sign anything. Without it, both certs create and
          #    fetch-signing-files fail with:
          #      "Cannot create resource without certificate private key"
          openssl genrsa -out /tmp/ios_distribution.key 2048
          # 3. Fetch (or create if missing) BOTH the distribution cert
          #    and the provisioning profile in one call. The
          #    --certificate-key flag (read from file via @file:) tells
          #    Apple to bind the new cert to the private key we just
          #    generated, so we have both halves locally.
          #    NB: Requires Admin role on the API key (Apple constraint
          #    for Distribution cert creation). If this fails with 403,
          #    upgrade the key role.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/ios_distribution.key \
            --create
          # 4. Import the fetched cert + key into the build keychain
          keychain add-certificates
          # 5. Wire the fetched profile into the xcodeproj
          xcode-project use-profiles

      - name: Archive + export .ipa
        script: |
          cd apps/web/ios/App
          # --project not --workspace — Capacitor 8 SPM produces no
          # .xcworkspace.
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - apps/web/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # No `beta_groups` entry. App Store Connect API explicitly rejects
        # assigning builds to INTERNAL groups via this field — internal
        # testers see every processed build automatically (no per-build
        # assignment needed). Previously had `beta_groups: [Internal Testers]`
        # which caused the build to finish "yellow" with the warning
        # "Cannot add internal group to a build" on every run.
        # When we add EXTERNAL beta groups in future, add them here —
        # those DO use this field, plus need first-build Beta App Review.
