# Codemagic build pipeline for the Capacitor iOS wrapper.
#
# We don't have a Mac, so all Xcode work happens in Codemagic's macOS
# build VMs. Each build:
#   1. Pulls fresh Node 22 + pnpm via corepack
#   2. Installs the monorepo with frozen lockfile
#   3. Runs `cap add ios` in apps/web to generate the Xcode project
#      from scratch (we don't commit ios/, since regenerating is fast
#      and avoids merge headaches)
#   4. Sets bundle version + build number
#   5. Archives + exports a signed .ipa via xcodebuild
#   6. Uploads to TestFlight via the App Store Connect API
#
# NB: Capacitor 8 uses Swift Package Manager — no CocoaPods, no
# Podfile, no .xcworkspace. xcodebuild resolves SPM dependencies
# automatically during archive.
#
# Free tier: 500 build minutes/month. A typical iOS build runs 8–12
# minutes so that's ~40 builds/month, plenty for early TestFlight.

workflows:
  ios-testflight:
    name: iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        # Encrypted in Codemagic UI. Need to be populated BEFORE first
        # build (see CAPACITOR_TESTFLIGHT.md for setup steps).
        - app_store_credentials
      vars:
        # Capacitor 8 uses Swift Package Manager — no .xcworkspace gets
        # generated (no Pods → no workspace). Build directly against the
        # .xcodeproj instead.
        XCODE_PROJECT: 'App.xcodeproj'
        XCODE_SCHEME: 'App'
        BUNDLE_ID: 'com.pointhacks.copilot'
      # Capacitor 8 CLI requires Node >= 22. Use current LTS.
      node: 22.11.0
      xcode: latest
      cocoapods: default

    integrations:
      # Configured in Codemagic UI: Settings → Integrations → App Store
      # Connect. Pulls Issuer ID, Key ID, and the .p8 private key.
      app_store_connect: pointhacks_appstore

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'mobile/*'
          include: true
          source: true
        - pattern: 'main'
          include: false

    scripts:
      - name: Install pnpm
        script: |
          # Update corepack itself FIRST. Node 20.18.0 ships with an older
          # corepack (~v0.29) that has stale npm-registry signing keys
          # hardcoded. npm has since rotated its keys, which breaks the
          # signature check when corepack downloads pnpm with the error:
          #   "Internal Error: Cannot find matching keyid"
          # The newer corepack ships with the rotated keys. See
          # https://github.com/nodejs/corepack/issues/612
          npm install -g corepack@latest
          corepack enable
          corepack prepare pnpm@10.33.1 --activate
          pnpm --version

      - name: Install workspace dependencies
        script: |
          pnpm install --frozen-lockfile

      - name: Generate iOS project via Capacitor
        script: |
          set -e
          cd apps/web
          # Clean any cached state from a previous build (Codemagic VMs
          # are fresh, but defensive — cap add refuses to overwrite an
          # existing ios/).
          rm -rf ios
          # Use `pnpm exec` not `npx` — in a pnpm workspace, npx can
          # resolve differently depending on hoisting and miss the
          # workspace-local @capacitor/cli. pnpm exec always uses the
          # workspace-resolved binary.
          pnpm exec cap add ios
          pnpm exec cap sync ios
          # Sanity check — Capacitor 8 uses Swift Package Manager, so we
          # expect App.xcodeproj + CapApp-SPM (NOT a Podfile — that's
          # Capacitor 6 and earlier).
          if [ ! -d ios/App/App.xcodeproj ]; then
            echo "ERROR: ios/App/App.xcodeproj missing after cap add ios"
            echo "--- ios/ ---"
            ls -la ios/ 2>&1 || echo "(ios/ does not exist)"
            echo "--- ios/App/ ---"
            ls -la ios/App/ 2>&1 || echo "(ios/App/ does not exist)"
            exit 1
          fi

      - name: Set bundle version + build number from Codemagic counter
        script: |
          cd apps/web/ios/App
          # Build number = Codemagic's auto-incrementing counter, so
          # TestFlight always accepts the upload as "newer".
          agvtool new-version -all $BUILD_NUMBER
          # Bundle version (CFBundleShortVersionString) stays semver —
          # bumped by hand in the Info.plist when shipping milestones.

      # NOTE: No CocoaPods step. Capacitor 8 manages iOS plugins via
      # Swift Package Manager (Package.swift + CapApp-SPM/). xcodebuild
      # resolves SPM dependencies automatically during archive — no
      # `pod install` needed. CocoaPods was required for Capacitor 6
      # and earlier only.

      - name: Set up code signing
        script: |
          # On a fresh Codemagic VM the keychain is empty and no
          # certificates or profiles exist locally. Build them from
          # scratch via the App Store Connect API integration.
          #
          # 1. Initialize a fresh build-only keychain
          keychain initialize
          # 2. CREATE a new iOS Distribution certificate via the API.
          #    Why create instead of fetch: existing certs in App Store
          #    Connect can't be downloaded with their private keys
          #    (Apple constraint — private keys only exist on the
          #    machine that originally generated them). Creating a new
          #    cert generates a fresh private key locally that we can
          #    sign with. --save stores it at the canonical Codemagic
          #    path for downstream commands to find.
          #    NB: Requires App Manager role on the API key. If this
          #    fails with 403, upgrade the key role in App Store
          #    Connect → Integrations.
          app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --save
          # 3. Fetch (or create if missing) the provisioning profile
          #    matching our bundle ID. Profiles tie the cert to the
          #    specific app + capabilities.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          # 4. Load the saved cert + key into the build keychain so
          #    xcodebuild can sign with it
          keychain add-certificates
          # 5. Wire the fetched profile into the xcodeproj
          xcode-project use-profiles

      - name: Archive + export .ipa
        script: |
          cd apps/web/ios/App
          # --project not --workspace — Capacitor 8 SPM produces no
          # .xcworkspace.
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - apps/web/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Auto-share to the internal testers group on every successful
        # build. External groups need manual review per build the first
        # few times, then beta-app review becomes near-instant.
        beta_groups:
          - Internal Testers
